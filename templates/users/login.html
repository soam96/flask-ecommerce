{% extends "base.html" %}

{% block title %}Login - E-Commerce Store{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0 text-center">Login to Your Account</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required
                               placeholder="Enter your username">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required
                               placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <div class="text-center mt-3">
                    <p>Don't have an account? <a href="{{ url_for('users.register') }}" class="text-decoration-none">Register here</a></p>
                </div>
                <div class="mt-3">
                    <div class="alert alert-info">
                        <small><strong>Demo Accounts:</strong><br>
                        Admin: admin / admin123<br>
                        Register new accounts as Customer or Seller</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
